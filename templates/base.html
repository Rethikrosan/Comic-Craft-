<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ComicCraft{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/">ComicCraft</a>
    <span class="tagline">AI Comic Story Creator</span>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    ComicCraft • Gemini + Stable Diffusion • Built with FastAPI
</footer>
</body>
</html>
